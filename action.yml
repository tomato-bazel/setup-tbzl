# setup-tbzl — name your tenant; the platform decides everything else.
#
# ⭐⭐ THE LOAD-BEARING PROPERTY: EVERY VALUE IS FETCHED AT RUNTIME, NEVER TRANSCRIBED.
# The endpoint, the token issuer, the scope, the `--credential_helper` host key, the
# exec-property routing token, `--jobs` and `--remote_max_connections` all come from ONE
# served document. They cannot drift apart because there is nowhere for a second copy to
# live — which is what turns the duplicate-endpoint bug from "fixed" into "unrepresentable".
#
# ⛔ THIS STEP FAILS RATHER THAN FALLING BACK. If the platform cannot be reached, if the
# document is empty, if the credential helper answers anonymously, if the runner is on the
# wrong fleet, or if a stale `RBE_ENDPOINT` is still in the environment — the step is red and
# no configuration is written. The credential helper underneath this stack fails OPEN at four
# layers and that property has already cost two fleet-wide outages misdiagnosed as unrelated
# systems. An autoconfigure that quietly substituted defaults would reproduce every one of
# them at every consumer simultaneously.
#
# ⭐ WHY THIS IS A COMPOSITE ACTION WRAPPING A STATIC BINARY, and not JavaScript or Docker.
# It runs at the head of every job on the plane, so its own cost is pure overhead: a
# JavaScript action pays a Node boot, a Docker action pays an image pull on a runner whose
# disk is already the binding constraint. A composite action that execs one static musl
# binary pays neither, and the binary parses + verifies in well under a millisecond.
#
# ⚠ THE ONE NETWORK FETCH IS `curl`, NOT RUST, AND THAT IS A DELIBERATE TRADE. Putting an
# HTTPS client in the binary means rustls or native-tls, which means ring's assembly or
# OpenSSL under a zig cross-compile — a real risk of a binary that builds and then fails at
# exec, for one GET whose cost is entirely I/O. curl is on every runner image and on the
# build-runner image. The cost of the trade is that "the platform was unreachable" is
# detected in two places (here, and again in the binary when the file is absent or empty);
# both are loud, and the duplication is the point.

name: "setup-tbzl"
description: >-
  Autoconfigure a Bazel build for the tbzl remote-execution plane. Name your tenant;
  the endpoint, credentials, exec properties and tuning are fetched from the platform.
author: "tomato-bazel"

branding:
  icon: "server"
  color: "red"

inputs:
  tenant:
    description: >-
      Tenant slug, e.g. `savvifi`. ⛔ ASSERTED AGAINST THE FETCHED DOCUMENT, NOT USED TO FIND
      IT. A `config-url` copied from another repo returns HTTP 200 and a perfectly valid
      profile — it is simply someone else's — and every other check in this Action passes on
      it, because nothing about it is malformed. This input is what makes that fatal.
    required: true
  plane:
    description: >-
      Plane the profile must declare, e.g. `tbzl-boston`. Omit to accept whichever plane the
      document names. ⚠ Asserted, like `tenant`; it does not select anything.
    required: false
    default: ""
  config-version:
    description: >-
      Require the document to be a specific published recommendation.
      ⭐ Use this to bisect a performance regression: the knobs are versioned precisely so a
      change to them is attributable and reversible. Omit to accept the served version.
      ⚠ Asserted, not selected — pin the URL to pin the document.
    required: false
    default: ""
  config-url:
    description: >-
      URL of the build profile document itself — not a service base. It is fetched verbatim,
      so a GitHub release asset, an S3 object or a `file://` path all work unchanged.
      ⭐ A PLAIN DOCUMENT IS THE POINT: the profile is an ARTEFACT, so it can be published,
      pinned, diffed and served by anything, and this Action needs no service to exist.
      ⛔ Because the URL names the document, `tenant` is checked AGAINST it rather than used
      to build it — see the `tenant` input.
      ⏰ When `config.tbzl.dev` exists it serves a document at a stable URL and this input
      goes back to having a default; the protocol does not change.
    required: true
  cache-root:
    description: >-
      Override `TBZL_CACHE_ROOT` — a directory SHARED by every executor on this host, holding
      the content-addressed bazel caches. ⭐ NORMALLY LEFT EMPTY: the runner declares it, which
      is what keeps this Action independent of any one runner fleet. A pod, a Buildkite agent
      and a laptop all answer differently, and none of that belongs in a workflow.
    required: false
    default: ""
  output-root:
    description: >-
      Override `TBZL_OUTPUT_ROOT` — a directory PRIVATE to this executor, holding bazel's
      output base. ⛔ It must NOT be inside `cache-root`: bazel takes an EXCLUSIVE lock on the
      output base, so executors sharing one serialise instead of sharing, and the symptom is
      "the plane got slower" rather than an error. setup-tbzl refuses that arrangement.
    required: false
    default: ""
  token-file:
    description: >-
      Path to the file holding the RBE bearer token, written by your token-minting step.
      ⚠ The VARIABLE NAME the credential helper looks up is derived from the endpoint, not
      taken from here — that derivation is the whole point. Only the path is yours.
    required: false
    default: "/tmp/rbe-token"
  cred-helper-version:
    description: >-
      Immutable `tomato-bazel/cred-helper` release tag.
      ⛔ NOT `credhelper-latest`: that rolling tag was last written 2026-06-16 and is nine
      commits behind the newest immutable release, so "latest" installs the OLDEST binary —
      one that predates both the `FASTVERK_TOKEN_FILE_<HOST>` source this Action depends on
      and the fix for the dead-code-eliminated config feature.
      ⭐ The default is the newest immutable release and is the FIRST one to publish a
      `cred-helper-linux-arm64` artifact; lowering it makes the arm64 branch of the install
      step 404.
    required: false
    default: "credhelper-782958de5ee6"
  allow-repo-bazelrc:
    description: >-
      Permit the repository's own .bazelrc to declare remote-execution flags alongside the
      generated one. ⛔ Off by default: `--remote_default_exec_properties` ACCUMULATES rather
      than replacing, so two `container-image` entries produce a platform no worker
      advertises and every action queues against an idle fleet with no error.
    required: false
    default: "false"
  strict:
    description: "Treat warnings as errors."
    required: false
    default: "false"
  skip-reachability:
    description: >-
      Skip the TCP dial of the endpoint. ⚠ Only for a runner with no egress at configure time;
      the dial is what turns the wrong-plane failure from a 20-minute
      `UNAVAILABLE: Network closed for unknown reason` into a one-second step failure.
    required: false
    default: "false"

outputs:
  bazelrc:
    description: >-
      Path to the generated bazelrc. ⚠ `--bazelrc` is a STARTUP flag:
      `bazel --bazelrc=${{ steps.x.outputs.bazelrc }} build //...`, never after the command.
    value: ${{ steps.configure.outputs.bazelrc }}
  config-version:
    description: "The recommendation version this build resolved. Record it in the build record."
    value: ${{ steps.configure.outputs.config-version }}
  endpoint:
    description: "The remote execution endpoint, if this plane serves execution."
    value: ${{ steps.configure.outputs.endpoint }}
  runner-label:
    description: "The `runs-on:` label whose runners can reach this plane."
    value: ${{ steps.configure.outputs.runner-label }}
  jobs:
    description: "The recommended --jobs, already in the bazelrc. Exposed for logging."
    value: ${{ steps.configure.outputs.jobs }}

runs:
  using: composite
  steps:
    # ── 1. the binary ────────────────────────────────────────────────────────────────────
    #
    # ⭐ PINNED BY (TAG, SHA256), AND THE CHECKSUM IS CHECKED. This Action runs with the
    # workflow's credentials in scope; a binary fetched over the network without verification
    # would be an unauthenticated code-execution seam in every consumer's CI.
    #
    # ⚠ `TBZL_SETUP_BIN` short-circuits the download. It exists so this repo's own CI can
    # exercise the Action against a freshly built binary — the alternative is that the Action
    # is only ever tested against the previous release, which is how a broken release ships.
    - name: Resolve tbzl-setup
      id: bin
      shell: bash
      run: |
        set -euo pipefail
        if [ -n "${TBZL_SETUP_BIN:-}" ]; then
          echo "::notice title=setup-tbzl::using TBZL_SETUP_BIN=${TBZL_SETUP_BIN}"
          echo "path=${TBZL_SETUP_BIN}" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        case "$(uname -s)/$(uname -m)" in
          Linux/x86_64)  asset=tbzl-setup-linux-amd64 ;;
          Linux/aarch64) asset=tbzl-setup-linux-arm64 ;;
          Darwin/arm64)  asset=tbzl-setup-darwin-arm64 ;;
          *) echo "::error title=setup-tbzl::no tbzl-setup artifact for $(uname -s)/$(uname -m)"; exit 1 ;;
        esac
        dest="${RUNNER_TEMP}/tbzl-setup"
        base="https://github.com/tomato-bazel/setup-tbzl/releases/download/${SETUP_TAG}"
        # ⛔ --fail-with-body, not --fail. A GitHub release 404 answers with a body that says
        # which tag was missing; --fail alone discards it and prints only "22", which reads as
        # a network problem.
        curl -sSL --fail-with-body --retry 3 --retry-connrefused \
             -o "$dest" "${base}/${asset}"
        curl -sSL --fail-with-body --retry 3 -o "${RUNNER_TEMP}/sha256.txt" \
             "${base}/tbzl-setup-sha256.txt"
        # ⛔ COMPARE TWO HEX STRINGS. DO NOT REBUILD A CHECKSUM FILE WITH sed.
        #
        # The previous version did, and it failed 100% of the time — on Linux AND macOS — for
        # every real consumer:
        #
        #   grep " ${asset}$" sha256.txt | sed "s| ${asset}$|  tbzl-setup|" | shasum -a 256 -c -
        #
        # sha256.txt separates hash from filename with TWO spaces. The grep pattern consumed one
        # of them and the replacement re-added two, so the rebuilt line carried THREE — and
        # `shasum -c` read the extra space as part of the FILENAME:
        #
        #   |2ef92f91…426   tbzl-setup|
        #    tbzl-setup: FAILED open or read
        #
        # ⛔ AND CI STRUCTURALLY COULD NOT SEE IT. Every test step sets TBZL_SETUP_BIN, which
        # short-circuits this entire block — so the one path every consumer takes was the one
        # path never exercised, and `v1` shipped with it broken.
        #
        # Extracting the field and comparing strings has no whitespace surface at all, and it
        # distinguishes "no checksum published" from "checksum did not match" instead of
        # reporting both as `FAILED open or read`.
        want=$(awk -v a="${asset}" '$NF == a { print $1 }' "${RUNNER_TEMP}/sha256.txt")
        [ -n "$want" ] || { echo "::error title=setup-tbzl::${SETUP_TAG} publishes no checksum for ${asset} — the release is incomplete. A half-published release looks complete from every angle except its asset list"; exit 1; }
        got=$(shasum -a 256 "$dest" | awk '{ print $1 }')
        [ "$want" = "$got" ] || { echo "::error title=setup-tbzl::checksum mismatch for ${asset} at ${SETUP_TAG}: expected ${want}, got ${got}"; exit 1; }
        chmod +x "$dest"
        echo "path=${dest}" >> "$GITHUB_OUTPUT"
      env:
        # ⭐ THE FIRST PUBLISHED RELEASE. `release.yml` publishes immutable `setuptbzl-<sha>`
        # tags on merge to main; this is the one from fb750d3, verified to carry all three
        # platform binaries AND `tbzl-setup-sha256.txt` before being pinned here.
        #
        # ⛔ NEVER `setuptbzl-latest`. A rolling tag is written by a publish step that can fail
        # halfway, and nothing reports that it did: the equivalent tag in
        # `tomato-bazel/cred-helper` sat NINE commits behind its newest immutable release, so
        # "latest" there installed the OLDEST binary.
        #
        # ⚠ CHECK THE ASSET LIST, NOT THE TAG, WHEN BUMPING THIS. A release can exist with only
        # some of its artifacts — `cslib-oleans` published darwin-only and the tag looked
        # complete from every angle except the one that mattered.
        #
        # A consumer pins `setup-tbzl@vN`, which pins this string, which pins the binary by
        # sha256 — one pin, three layers.
        SETUP_TAG: setuptbzl-4bd9e365a801

    # ── 2. the credential helper ─────────────────────────────────────────────────────────
    - name: Install the credential helper
      id: helper
      shell: bash
      run: |
        set -euo pipefail
        dest="${RUNNER_TEMP}/cred-helper"
        case "$(uname -s)/$(uname -m)" in
          Linux/x86_64)  asset=cred-helper-linux-amd64 ;;
          # ⭐ linux-arm64 EXISTS AS OF credhelper-782958de5ee6 and did not before. The pin
          # below was raised past that release, so this case is reachable; with the previous
          # pin (credhelper-a920bfbf49ea) it would 404. If you ever lower the pin, this arm
          # goes back to being a lie.
          Linux/aarch64) asset=cred-helper-linux-arm64 ;;
          Darwin/arm64)  asset=cred-helper-darwin-arm64 ;;
          *) echo "::error title=setup-tbzl::cred-helper has no artifact for $(uname -s)/$(uname -m)"; exit 1 ;;
        esac
        base="https://github.com/tomato-bazel/cred-helper/releases/download/${CRED_HELPER_TAG}"
        curl -sSL --fail-with-body --retry 3 -o "$dest" "${base}/${asset}"
        # ⛔ THIS BINARY WAS FETCHED WITH NO VERIFICATION AT ALL — curl, then chmod +x. The step
        # above argues, correctly, that an unverified download is "an unauthenticated
        # code-execution seam in every consumer's CI". That reasoning was applied to one of the
        # two binaries this Action installs and not the other, and cred-helper publishes
        # cred-helper-sha256.txt — so the asymmetry bought nothing.
        #
        # ⚠ AND THIS IS THE BINARY THAT HANDLES THE BEARER TOKEN. If either download deserved
        # the check more, it was this one.
        curl -sSL --fail-with-body --retry 3 -o "${RUNNER_TEMP}/cred-helper-sha256.txt" \
          "${base}/cred-helper-sha256.txt"
        want=$(awk -v a="${asset}" '$NF == a { print $1 }' "${RUNNER_TEMP}/cred-helper-sha256.txt")
        [ -n "$want" ] || { echo "::error title=setup-tbzl::${CRED_HELPER_TAG} publishes no checksum for ${asset}"; exit 1; }
        got=$(shasum -a 256 "$dest" | awk '{ print $1 }')
        [ "$want" = "$got" ] || { echo "::error title=setup-tbzl::cred-helper checksum mismatch for ${asset} at ${CRED_HELPER_TAG}: expected ${want}, got ${got}"; exit 1; }
        chmod +x "$dest"
        echo "path=${dest}" >> "$GITHUB_OUTPUT"
      env:
        CRED_HELPER_TAG: ${{ inputs.cred-helper-version }}

    # ── 3. the profile ───────────────────────────────────────────────────────────────────
    #
    # ⛔ AN UNREACHABLE PLATFORM IS A FAILURE, NOT A DEFAULT. `--fail-with-body` makes a 404
    # or a 500 non-zero and still prints the server's explanation, and `set -e` stops the job
    # here. The binary checks again — an empty or truncated body is a 200 — and stops there
    # too. Two checks, because this is the branch where an autoconfigure quietly ruins a
    # fleet.
    - name: Fetch the build profile
      id: profile
      shell: bash
      run: |
        set -euo pipefail
        out="${RUNNER_TEMP}/tbzl-build-profile.json"
        # ⚠ GitHub does NOT enforce `required: true` on composite-action inputs — an omitted
        # one arrives as the empty string and `curl ""` fails with a message about a URL
        # syntax error, which reads as a malformed URL rather than a missing one.
        [ -n "${CONFIG_URL}" ] || {
          echo "::error title=setup-tbzl::config-url is required and was empty. It is the URL of the build profile DOCUMENT (a release asset, an S3 object, or a file:// path) — there is no default, because guessing one is exactly the fall-back this Action refuses to do"
          exit 1
        }
        echo "::notice title=setup-tbzl::fetching ${CONFIG_URL}"
        # ⚠ file:// is supported by curl and is how this is exercised without a service.
        curl -sSL --fail-with-body --retry 3 --retry-connrefused --max-time 20 \
             -H 'Accept: application/json' -o "$out" "${CONFIG_URL}" \
          || { echo "::error title=setup-tbzl::cannot fetch the build profile from ${CONFIG_URL}. setup-tbzl does NOT fall back to defaults"; exit 1; }
        [ -s "$out" ] || { echo "::error title=setup-tbzl::the profile at ${CONFIG_URL} is EMPTY. An empty 200 is the failure this checks for: it parses as 'no configuration' rather than as an error"; exit 1; }
        echo "path=${out}" >> "$GITHUB_OUTPUT"
      env:
        CONFIG_URL: ${{ inputs.config-url }}

    # ── 4. verify, then write ────────────────────────────────────────────────────────────
    - name: Configure
      id: configure
      shell: bash
      run: |
        set -euo pipefail
        flags=()
        [ "${ALLOW_RC}"   = "true" ] && flags+=(--allow-repo-bazelrc)
        [ "${STRICT}"     = "true" ] && flags+=(--strict)
        [ "${SKIP_REACH}" = "true" ] && flags+=(--skip-reachability)
        [ -f "${GITHUB_WORKSPACE}/.bazelrc" ] && flags+=(--repo-bazelrc "${GITHUB_WORKSPACE}/.bazelrc")
        # ⛔ THE IDENTITY ASSERTIONS, AND THEY ARE THE COST OF NAMING A DOCUMENT BY URL. With a
        # query string the SERVER resolved tenant→document and a wrong name 404'd. A URL is
        # resolved by whoever typed it, and the wrong one answers 200 with a valid profile for
        # somebody else's plane. Only these flags make that fatal.
        #
        # ⚠ Empty values are passed through deliberately: the binary treats an empty expectation
        # as "not asserted", so `plane`/`config-version` stay optional without a second code
        # path here that could disagree with the binary about what empty means.
        # ⚠ ONLY WHEN NON-EMPTY, and that is not a style choice. An Action input that was not
        # supplied renders as the empty string; passing it through would MASK the value the
        # runner itself set, turning "I did not override this" into "there is no shared cache".
        [ -n "${CACHE_ROOT}" ]  && flags+=(--cache-root "${CACHE_ROOT}")
        [ -n "${OUTPUT_ROOT}" ] && flags+=(--output-root "${OUTPUT_ROOT}")
        [ -n "${TENANT}" ] && flags+=(--expect-tenant "${TENANT}")
        [ -n "${PLANE}" ]  && flags+=(--expect-plane "${PLANE}")
        [ -n "${PIN}" ]    && flags+=(--expect-config-version "${PIN}")
        # ⚠ `${flags[@]+"${flags[@]}"}`, NOT `"${flags[@]}"`. Expanding an EMPTY array under
        # `set -u` is an "unbound variable" error in bash 3.2 — which is what `/bin/bash` is on
        # a macOS runner, and this Action supports Darwin/arm64. Every flag above is
        # conditional, so the empty case is reachable, and the failure would appear only on
        # macOS as an error that names `flags` rather than anything a user configured.
        "${SETUP}" configure \
          --profile "${PROFILE}" \
          --out "${RUNNER_TEMP}/tbzl" \
          --cred-helper "${HELPER}" \
          --token-file "${TOKEN_FILE}" \
          ${flags[@]+"${flags[@]}"}
      env:
        SETUP: ${{ steps.bin.outputs.path }}
        HELPER: ${{ steps.helper.outputs.path }}
        PROFILE: ${{ steps.profile.outputs.path }}
        TOKEN_FILE: ${{ inputs.token-file }}
        TENANT: ${{ inputs.tenant }}
        PLANE: ${{ inputs.plane }}
        PIN: ${{ inputs.config-version }}
        CACHE_ROOT: ${{ inputs.cache-root }}
        OUTPUT_ROOT: ${{ inputs.output-root }}
        ALLOW_RC: ${{ inputs.allow-repo-bazelrc }}
        STRICT: ${{ inputs.strict }}
        SKIP_REACH: ${{ inputs.skip-reachability }}
