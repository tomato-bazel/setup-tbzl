# Publish `tbzl-setup` so `action.yml` can fetch it with NO auth.
#
# ⛔ THE NO-AUTH PART IS THE WHOLE DESIGN. The first consumer is `savvifi/aion` — a DIFFERENT
# ORG. A private release asset would need a cross-org token in every consumer workflow, and
# the savvifi PATs were deleted on 2026-08-04. Making the repo public removed the credential
# instead of managing it. If this repo is ever made private, every consumer breaks at the
# download step in `action.yml`, not at build time.
#
# ⭐ ONE MACOS JOB PRODUCES EVERY ARTIFACT. macos-14 builds darwin/arm64 natively and the two
# Linux targets via zig cross-compile, so all three come from the same commit. Two jobs could
# disagree about which commit they built, and nothing downstream would notice.
#
# ⚠ macos runners are billed at a multiplier on PRIVATE repos. This one is public, where
# GitHub-hosted minutes are free.
#
# Two releases per merge:
#   setuptbzl-latest    rolling pointer, clobbered every build — do NOT pin
#   setuptbzl-<sha>     ⭐ IMMUTABLE per-commit release — this is what action.yml names
#
# ⛔ AND THE ROLLING TAG IS NOT MERELY DISCOURAGED, IT IS A MEASURED HAZARD. In the sibling
# `tomato-bazel/cred-helper` repo the equivalent `credhelper-latest` was last written
# 2026-06-16 and is NINE commits behind the newest immutable release — because a `create ||
# upload` that fails partway leaves it stale and nothing reports that. "latest" there installs
# the OLDEST binary. Pin the sha tag.

name: release

on:
  push:
    branches: [main]
    paths:
      # ⛔⛔ `action.yml` IS IN THIS LIST BECAUSE ITS ABSENCE WOULD HAVE STRANDED THE FIX FOR
      # AN UNLOADABLE MANIFEST. It is the one file every consumer actually executes, and it
      # was the only one not listed here — so a change to it alone cut NO release, moved
      # `v1` nowhere, and left every consumer on the broken tag while `main` read as fixed.
      #
      # ⚠ That is precisely the bug this commit repairs: v1.0.0's `action.yml` was unloadable,
      # and an action.yml-only fix would not have shipped. This PR only triggered a release
      # because it happens to add a file under `tests/` — luck, not design.
      - 'action.yml'
      - 'src/**'
      - 'tests/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'BUILD.bazel'
      - 'MODULE.bazel'
      - '.bazelrc'
      - 'tools/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # ⚠ cancel-in-progress is FALSE: a cancelled publish leaves a partial release, and the
  # immutable per-commit tags must not be skipped just because a newer merge landed.
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: bazel-contrib/setup-bazel@663f88d97adf17db2523a5b385d9407a562e5551  # 0.13.0
        with:
          bazelisk-cache: true
          disk-cache: true

      # ⛔ TEST BEFORE PUBLISHING. Everything downstream of a bad binary here fails in a
      # consumer's CI, in a step whose message will name their build rather than this release.
      - name: Test
        run: bazel test //... --config=ci --keep_going

      - name: Build every artifact
        run: |
          set -euo pipefail
          bazel build //:tbzl-setup
          cp bazel-bin/tbzl-setup tbzl-setup-darwin-arm64

          bazel build --platforms=//tools/platforms:linux_amd64 //:tbzl-setup
          cp bazel-bin/tbzl-setup tbzl-setup-linux-amd64

          # ⚠ Built although nothing consumes it yet. `tomato-bazel/cred-helper` publishes NO
          # linux-arm64 asset, so an arm64 runner has a setup binary and no credential helper
          # — `action.yml` fails loudly on that rather than probing with nothing.
          bazel build --platforms=//tools/platforms:linux_arm64 //:tbzl-setup
          cp bazel-bin/tbzl-setup tbzl-setup-linux-arm64

          chmod 0755 tbzl-setup-*

          # ⛔ ASSERT THE CROSS-COMPILE ACTUALLY CROSSED. A zig toolchain that silently fell
          # back to the host would publish a darwin binary under the linux-amd64 NAME. It
          # installs fine and fails at exec with "cannot execute binary file", which reads as
          # a corrupt download.
          file tbzl-setup-linux-amd64 | grep -q 'ELF 64-bit.*x86-64' \
            || { echo "::error::linux-amd64 artifact is not an x86-64 ELF"; exit 1; }
          file tbzl-setup-linux-arm64 | grep -q 'ELF 64-bit.*ARM aarch64' \
            || { echo "::error::linux-arm64 artifact is not an aarch64 ELF"; exit 1; }
          file tbzl-setup-darwin-arm64 | grep -q 'Mach-O.*arm64' \
            || { echo "::error::darwin artifact is not an arm64 Mach-O"; exit 1; }

          # ⭐ THE BUILD PROFILES SHIP AS RELEASE ASSETS, WHICH IS THE WHOLE DELIVERY
          # MECHANISM. docs/autoconfigure.md is explicit that the profile must NOT be a
          # service: `setup-tbzl` fails loud by design, so a config service being down would
          # not degrade builds — it would STOP EVERY BUILD ON THE PLANE. A profile is a small
          # immutable per-version document; it is an ARTEFACT, not a query.
          #
          # ⛔ AND SERVING IT FROM `main` WOULD BE WORSE THAN A SERVICE. A raw.githubusercontent
          # URL on a branch is MUTABLE: editing the file silently changes every consumer's
          # build flags with no version to attribute the change to, which is exactly the
          # "versioned, not per-build adaptive" constraint that document sets. Pinned to an
          # immutable tag, a recommendation change is a deliberate bump.
          cp tests/fixtures/tbzl-*.json .
          shasum -a 256 tbzl-setup-* tbzl-*.json > tbzl-setup-sha256.txt
          cat tbzl-setup-sha256.txt

      - name: Publish rolling prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # ⛔ DERIVED, NOT RESTATED. This list used to name the two profiles literally while the
          # copy step above GLOBBED them — so adding a profile copied it into place and published
          # NOTHING, and the release looked complete from every angle except its asset list. That
          # is the same half-published shape that made `cslib-oleans` ship darwin-only.
          FILES="tbzl-setup-darwin-arm64 tbzl-setup-linux-amd64 tbzl-setup-linux-arm64 tbzl-setup-sha256.txt $(ls tbzl-*.json | tr '\n' ' ')"
          # ⚠ An empty profile glob would silently publish binaries with no profile at all, and a
          # consumer's config-url would then 404 against a release that exists.
          ls tbzl-*.json >/dev/null 2>&1 || { echo "::error::no tbzl-*.json profiles were staged — the release would ship binaries with no build profile"; exit 1; }
          # ⚠ View-then-act rather than `create || upload`: `gh release create` fails
          # confusingly when the tag exists remotely but not locally.
          if gh release view setuptbzl-latest >/dev/null 2>&1; then
            gh release upload setuptbzl-latest $FILES --clobber
          else
            gh release create setuptbzl-latest $FILES \
              --title 'setup-tbzl (rolling)' \
              --notes 'Rolling build — do NOT pin; the bytes change every merge. Pin an immutable setuptbzl-<sha> release.' \
              --prerelease --target "$GITHUB_SHA"
          fi

      - name: Publish immutable per-commit release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHA="${GITHUB_SHA:0:12}"
          TAG="setuptbzl-${SHA}"
          # ⛔ DERIVED, NOT RESTATED. This list used to name the two profiles literally while the
          # copy step above GLOBBED them — so adding a profile copied it into place and published
          # NOTHING, and the release looked complete from every angle except its asset list. That
          # is the same half-published shape that made `cslib-oleans` ship darwin-only.
          FILES="tbzl-setup-darwin-arm64 tbzl-setup-linux-amd64 tbzl-setup-linux-arm64 tbzl-setup-sha256.txt $(ls tbzl-*.json | tr '\n' ' ')"
          # ⚠ An empty profile glob would silently publish binaries with no profile at all, and a
          # consumer's config-url would then 404 against a release that exists.
          ls tbzl-*.json >/dev/null 2>&1 || { echo "::error::no tbzl-*.json profiles were staged — the release would ship binaries with no build profile"; exit 1; }
          # ⛔ NEVER re-upload to an existing immutable tag. action.yml verifies (url, sha256)
          # against it, so a consumer would start failing its checksum with no change on its
          # side — and the message would name a corrupt download.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Immutable release $TAG exists — leaving assets untouched."
          else
            gh release create "$TAG" $FILES \
              --title "setup-tbzl ${SHA}" \
              --notes "Immutable, pinned to commit ${SHA}. action.yml pins (url, sha256) against a tag like this one." \
              --prerelease --target "$GITHUB_SHA"
          fi
          echo "Asset base: https://github.com/tomato-bazel/setup-tbzl/releases/download/${TAG}/"

      # ⭐⭐ THE RELEASE PINS ITSELF, AND THEN MOVES v1 — WITHOUT EVER WRITING TO main.
      #
      # ⛔ THE EARLIER VERSION PUSHED THE PIN COMMIT TO main AND COULD NOT WORK: main is a
      # protected branch, deliberately, so every release failed with
      #
      #   GH006: Protected branch update failed for refs/heads/main
      #
      # and v1 silently stayed four merges behind. A release mechanism that requires rewriting
      # the protected default branch on every merge is not a mechanism, it is a standing
      # exception. Tags are not branch-protected, and a release IS a tag.
      #
      # So the pin commit is created and never pushed to any branch — only the release tags
      # point at it. That is the same shape as an action that commits its built `dist/` on a
      # release ref: main holds source, the tag holds what consumers execute.
      #
      # ⛔ A HAND-WRITTEN PIN CAN NEVER BE CORRECT. action.yml names the release its binary comes
      # from, but the release for a commit does not exist until that commit is merged — so a PR
      # can only ever name the PREVIOUS release. Three times today the guard `the pinned binary
      # understands action.yml` went red for exactly that: a branch opened before a bump, carrying
      # a pin that predated a flag its own action.yml passes. The guard was right every time; the
      # ergonomics were wrong.
      #
      # ⛔ AND v1 WAS PURELY MANUAL, so it lagged FOUR merges. Anyone pinning setup-tbzl@v1 was
      # getting a version with no `resolve` phase, no per-org profiles and a credential-helper
      # false positive — and no check could see it, because every check runs against the branch,
      # never against what the tag resolves to.
      #
      # So: cut the release, rewrite the pin to the tag just cut, commit, move v1 to that commit.
      # v1 then always names a commit whose action.yml pins its OWN release, which is the only
      # self-consistent state and one no human can produce by hand.
      #
      # ⚠ IT CANNOT LOOP. A push made with GITHUB_TOKEN does not create a workflow run, so the
      # pin commit does not re-trigger release.yml.
      - name: Pin action.yml at this release, then publish vN and move v1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="setuptbzl-${GITHUB_SHA:0:12}"

          current=$(sed -n 's/^ *SETUP_TAG: *\(.*\)$/\1/p' action.yml | head -1)
          [ -n "$current" ] || { echo "::error::could not read SETUP_TAG from action.yml — the pin cannot be updated and v1 must NOT move"; exit 1; }

          if [ "$current" = "$TAG" ]; then
            echo "::notice::action.yml already pins ${TAG}"
          else
            # ⛔ NO `sed -i`. THIS JOB RUNS ON macos-14, BECAUSE IT BUILDS THE DARWIN BINARY
            # NATIVELY — and BSD sed's `-i` REQUIRES a backup-extension argument where GNU's
            # forbids one. The GNU spelling therefore read the script as the extension and the
            # filename as the script:
            #
            #   sed: 1: "action.yml": command a expects \ followed by text
            #
            # ⚠ A message that names neither sed's dialect nor the flag, on the one step in this
            # repository that had never run before. Writing through a temp file has no dialect.
            tmp=$(mktemp)
            sed "s|SETUP_TAG: ${current}|SETUP_TAG: ${TAG}|" action.yml > "$tmp" && mv "$tmp" action.yml
            # ⚠ Verify the substitution rather than trusting sed, whose exit code is 0 whether or
            # not it matched anything.
            grep -q "SETUP_TAG: ${TAG}" action.yml || { echo "::error::pin rewrite did not take effect (still ${current})"; exit 1; }
            # ⚠ COMMITTED, NEVER PUSHED TO A BRANCH. Only the release tags below point at this
            # commit. main is protected and stays source-only.
            git -c user.name='setup-tbzl-ci' -c user.email='ci@tomato-bazel.invalid' \
              commit -q -a -m "release: pin action.yml at ${TAG}" \
              -m "Written by release.yml after publishing ${TAG}. A hand-written pin can only ever name the PREVIOUS release, because the release for a commit does not exist until that commit is merged. This commit is reachable only from the release tags."
            echo "::notice::pinned action.yml at ${TAG}"
          fi

          # ⛔ THE TAGS POINT AT THE PINNED COMMIT, NOT AT $GITHUB_SHA. Those differ whenever the
          # step above committed, and the pinned commit is the only one whose action.yml names
          # this release. Tagging $GITHUB_SHA would republish the placeholder under the tag
          # consumers actually use — which is the bug this whole step exists to end.
          target=$(git rev-parse HEAD)

          # ⛔ SELF-CONSISTENCY IS ASSERTED BEFORE ANY TAG MOVES. If the freshly published binary
          # does not understand a flag this action.yml passes, publishing v1 would break every
          # consumer at once. Better to leave v1 where it is and fail here.
          probe="${RUNNER_TEMP}/probe"
          curl -sSL --fail-with-body --retry 3 -o "$probe" \
            "https://github.com/tomato-bazel/setup-tbzl/releases/download/${TAG}/tbzl-setup-linux-amd64"
          # ⚠ Cannot exec a linux binary on macos-14, so this asserts the ASSET EXISTS and is the
          # right architecture. The flag-level check runs in ci.yml against a native build.
          file "$probe" | grep -q 'ELF 64-bit.*x86-64' \
            || { echo "::error::${TAG} does not publish a usable linux-amd64 asset — refusing to move v1"; exit 1; }

          # ── the version tags ──
          # ⭐ TWO TAGS, TWO JOBS. `v1` floats so consumers get patches with no change on their
          # end; `v1.Y.Z` is immutable so anyone who wants an exact pin has one. This is the
          # ordinary GitHub Action convention, and it is why consumers never touch a sha.
          git fetch -q --tags origin
          last=$(git tag -l 'v1.*.*' | sort -V | tail -1)
          if [ -z "$last" ]; then
            next="v1.0.0"
          else
            IFS=. read -r maj min patch <<<"${last#v}"
            next="v${maj}.${min}.$((patch + 1))"
          fi
          # ⚠ An immutable tag is never rewritten. If it somehow exists, stop rather than -f it.
          if git rev-parse -q --verify "refs/tags/${next}" >/dev/null; then
            echo "::error::${next} already exists — refusing to rewrite an immutable version tag"; exit 1
          fi

          git tag -a "$next" "$target" -m "setup-tbzl ${next} (pins ${TAG})"
          git push origin "refs/tags/${next}"
          git tag -f v1 "$target"
          git push -f origin refs/tags/v1
          echo "::notice::${next} and v1 -> ${target:0:12} (pins ${TAG})"

          # ⭐ A real release for the version tag, so `v1.Y.Z` shows up as a version rather than
          # only as a git ref. Assets live on the immutable setuptbzl-<sha> release; this one is
          # the human-facing entry point.
          gh release create "$next" \
            --title "setup-tbzl ${next}" \
            --notes "Pins \`${TAG}\`. Consumers should use \`tomato-bazel/setup-tbzl@v1\` — it moves to each release, so patches need no change on your end. Pin \`${next}\` to freeze an exact version."
